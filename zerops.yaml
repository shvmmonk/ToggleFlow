zerops:
  - setup: api
    build:
      base: java@17
      buildCommands:
        - cd feature-flag-service && ./mvnw clean package -DskipTests
      deployFiles: feature-flag-service/target/feature-flag-service-1.0.0.jar
      cache: feature-flag-service/~/.m2

    run:
      base: java@17
      ports:
        - port: 8080
          httpSupport: true
      envVariables:
        JDBC_DATABASE_URL: jdbc:postgresql://db:5432/db
        DB_USER: ${db_user}
        DB_PASS: ${db_password}
        DB_DRIVER: org.postgresql.Driver
        JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      start: java -jar feature-flag-service/target/feature-flag-service-1.0.0.jar
